# Botón "Sincronizar sesiones" de la página: esta corrida no hace nada por sí misma.
# mini consulta cada hora si hubo una corrida nueva y, si la hay, sincroniza y publica.
name: Sincronizar
on: workflow_dispatch
permissions: {}
jobs:
  pedido:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pedido registrado. mini lo revisa una vez por hora: sincroniza y la página se actualiza en la hora siguiente."
