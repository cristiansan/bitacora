# Botón "Sincronizar sesiones" de la página: esta corrida no hace nada por sí misma.
# mini consulta cada 2 minutos si hubo una corrida nueva y, si la hay, sincroniza y publica.
name: Sincronizar
on: workflow_dispatch
permissions: {}
jobs:
  pedido:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pedido registrado. mini sincroniza en menos de 2 minutos y la página se actualiza al rato."
